<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        var redirectTo = '/JudgeMobileApp/index.html' + location.search + location.hash;
        var path = location.pathname.replace('/JudgeMobileApp', '');
        if (path && path !== '/index.html') {
            redirectTo += '?path=' + encodeURIComponent(path);
        }
        window.location.replace(redirectTo);
    </script>
</head>
<body>
</body>
</html>
